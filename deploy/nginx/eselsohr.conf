# nginx in front of the Eselsohr web app (the `web` service in docker-compose.yml, on 127.0.0.1:8090).
#
#   sudo cp deploy/nginx/eselsohr.conf /etc/nginx/sites-available/eselsohr.gunne.one
#   sudo ln -s /etc/nginx/sites-available/eselsohr.gunne.one /etc/nginx/sites-enabled/
#   sudo certbot certonly --nginx -d eselsohr.gunne.one
#   sudo nginx -t && sudo systemctl reload nginx
#
# Until the certificate exists, `nginx -t` fails on the ssl_certificate lines: enable only the port-80
# block first, run certbot, then add the 443 block.
#
# The app needs PUBLIC_URL=https://eselsohr.gunne.one and SESSION_SECRET in .env.

server {
    listen 80;
    listen [::]:80;
    server_name eselsohr.gunne.one;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eselsohr.gunne.one;

    ssl_certificate     /etc/letsencrypt/live/eselsohr.gunne.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eselsohr.gunne.one/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        # uvicorn runs with proxy_headers and FORWARDED_ALLOW_IPS=*: real client IPs for the rate limits,
        # and https for secure cookies and the Google/Telegram sign-in redirects
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Building and mailing a book can take a while
        proxy_read_timeout 300s;
    }
}
